[env:esp32-s3-eth]
; Pinned to a concrete pioarduino release (arduino-esp32 3.2.0 / ESP-IDF 5.4).
; 3.x changed several core APIs (timer, LEDC) vs 2.x — the firmware is migrated
; to 3.x, so keep this pinned to avoid silent drift when a newer core lands.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1-16mb
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter

board_build.usb_cdc_on_boot = 1
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.filesystem = littlefs
board_build.partitions = partitions/control_16MB.csv

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWS_TX_BUFFER_SIZE=2048
    -DARDUINOJSON_ENABLE_COMMENTS=1
    -DCONTROL_FW_VERSION=\"0.3.50\"
    -include src/glibcxx_fix.h
    ; Passing an Arduino String to printf-style %s prints garbage (and is UB):
    ; make that a compile error. (log_* functions carry a printf format attribute.)
    -Werror=conditionally-supported
    -Isrc
    -Isrc/hardware
    -Isrc/platform
    -Isrc/apps

extra_scripts = 
    pre:scripts/make_root_ca.py
    pre:scripts/make_web_file_hedder.py
    pre:scripts/cc_env.py

lib_deps = 
    olikraus/U8g2 @ ^2.36.15
    bblanchon/ArduinoJson @ ^7.0.4
    arduino-libraries/Ethernet @ ^2.0.2
    arduino-libraries/ArduinoHttpClient @ ^0.6.1
    mobizt/ESP_SSLClient @ ^3.1.3
