<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCS Control</title>
  <style>
    :root{
      --mcs-blue:#047cd2; --mcs-blue-d:#0362a6; --heading:#2a3139;
      --body:#4d5968; --bg:#f6f8fa; --card:#fff; --line:#e3e8ee;
      --ok:#046c4e; --warn:#b76e00; --alarm:#b42318;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--body)}
    header{background:linear-gradient(135deg,var(--mcs-blue),var(--mcs-blue-d));
      color:#fff;padding:16px 20px}
    header .logo{height:34px;display:block;filter:brightness(0) invert(1)}
    header .sub{opacity:.9;font-size:13px;margin-top:6px}
    nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
    nav a{padding:8px 14px;border-radius:8px;background:#eef4fb;color:var(--mcs-blue-d);
      font-weight:700;font-size:13px;text-decoration:none}
    nav a.active{background:var(--mcs-blue);color:#fff}
    main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
    h2{color:var(--heading);font-size:15px;font-weight:800;margin:18px 0 8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:14px 16px;box-shadow:0 1px 3px rgba(16,40,70,.05)}
    .card .name{font-weight:800;color:var(--heading);font-size:14px}
    .card .big{font-size:26px;font-weight:800;color:var(--mcs-blue-d);margin:6px 0 2px}
    .card .sub{font-size:12px;color:#8a94a0}
    .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;
      border-radius:999px;margin-top:8px}
    .badge.ok{background:#def7ec;color:var(--ok)}
    .badge.low{background:#fde8e8;color:var(--alarm)}
    .badge.overfill{background:#fdf0e3;color:var(--warn)}
    .badge.fault{background:#efe7fb;color:#6b27b4}
    .empty{color:#8a94a0;font-size:13px;padding:8px 0}
    .foot{margin-top:24px;font-size:12px;color:#9aa4b0}
  </style>
</head>
<body>
  <header>
    <img class="logo" alt="MCS" src="/logo.png">
    <div class="sub" id="devsub">Live overview</div>
  </header>
  <nav>
    <a href="/" class="active">Home</a>
    <a href="/tanks.html">Tanks</a>
    <a href="/pumps.html">Pumps</a>
    <a href="/setup.html">Setup</a>
    <a href="/test.html">Test</a>
    <a href="/ota.html">Update</a>
  </nav>
  <main>
    <h2>Tanks</h2>
    <div class="grid" id="tanks"><div class="empty">Loading…</div></div>

    <h2>Pumps</h2>
    <div class="grid" id="pumps"><div class="empty">Loading…</div></div>

    <div class="foot" id="foot"></div>
  </main>

  <script>
    const API = "/api/function_silo";
    const call = (subject, data) => fetch(API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(data ? {subject, data} : {subject})
    }).then(r => r.json()).catch(() => null);

    function tankCard(p){
      const pct = Math.round(p.pct ?? 0);
      const hasLut = p.has_lut && (p.liters ?? 0) > 0;
      const main = hasLut ? (p.liters + " L") : ((p.mm ?? 0) + " mm");
      let badge = '<span class="badge ok">OK</span>';
      if (p.state === "low_level") badge = '<span class="badge low">LOW</span>';
      else if (p.state === "overfill") badge = '<span class="badge overfill">OVERFILL</span>';
      else if (p.state === "fault") badge = '<span class="badge fault">FAULT</span>';
      return `<div class="card">
        <div class="name">${p.id ?? "Tank"}</div>
        <div class="big">${pct}%</div>
        <div class="sub">${main}${p.media ? " · " + p.media : ""}</div>
        ${badge}</div>`;
    }

    function pumpCard(p){
      const noz = p.nozzle_lifted ? "LIFTED" : "hung";
      const relay = p.relay_on ? "ON" : "off";
      return `<div class="card">
        <div class="name">${p.name ?? "Pump"}</div>
        <div class="big">${(p.litres ?? 0).toFixed(2)} L</div>
        <div class="sub">Nozzle ${noz} · Pump ${relay}</div></div>`;
    }

    async function refresh(){
      const t = await call("cloudgauge_get_all");
      const tanks = document.getElementById("tanks");
      if (t && Array.isArray(t.probes) && t.probes.length){
        tanks.innerHTML = t.probes.map(tankCard).join("");
      } else { tanks.innerHTML = '<div class="empty">No tanks configured</div>'; }

      const u = await call("pump_get_all");
      const pumps = document.getElementById("pumps");
      if (u && Array.isArray(u.pumps) && u.pumps.length){
        pumps.innerHTML = u.pumps.map(pumpCard).join("");
      } else { pumps.innerHTML = '<div class="empty">No pumps configured</div>'; }

      document.getElementById("foot").textContent =
        "Updated " + new Date().toLocaleTimeString();
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
