<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MCS Control — Hardware Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
    h1 { font-size: 1.4em; margin-bottom: 12px; color: #00d4ff; }
    h2 { font-size: 1.1em; margin: 16px 0 8px; color: #7ec8e3; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .btn { padding: 12px 8px; font-size: 14px; cursor: pointer; background: #16213e; color: #eee; border: 1px solid #0f3460; border-radius: 6px; transition: all 0.15s; }
    .btn:hover { background: #0f3460; border-color: #00d4ff; }
    .btn:active { transform: scale(0.97); }
    .btn.running { opacity: 0.6; cursor: wait; }
    #output { background: #0d1117; border: 1px solid #333; border-radius: 6px; padding: 12px; font-family: 'SF Mono', monospace; font-size: 13px; white-space: pre-wrap; max-height: 50vh; overflow-y: auto; line-height: 1.5; }
    .pass { color: #3fb950; }
    .fail { color: #f85149; }
    .info { color: #79c0ff; }
    .warn { color: #d29922; }
  </style>
</head>
<body>
  <h1>⚡ MCS Control — Hardware Test</h1>

  <h2>Quick</h2>
  <div class="grid">
    <button class="btn" onclick="run('test_i2c_scan')">🔍 I2C Scan</button>
    <button class="btn" onclick="run('test_adc_read')">📊 ADC Read</button>
    <button class="btn" onclick="run('test_version')">📋 Version</button>
  </div>

  <h2>Self-Test</h2>
  <div class="grid">
    <button class="btn" onclick="run('test_selftest')">🧪 Full (quick)</button>
    <button class="btn" onclick="run('test_selftest',{section:'i2c',verbose:true})">🔌 I2C</button>
    <button class="btn" onclick="run('test_selftest',{section:'analog',verbose:true})">📈 Analog</button>
    <button class="btn" onclick="run('test_selftest',{section:'supply',verbose:true})">⚡ Supply</button>
    <button class="btn" onclick="run('test_selftest',{section:'digital',verbose:true})">🔢 Digital</button>
  </div>

  <h2>I/O Control</h2>
  <div style="margin-bottom:8px;">
    <label style="color:#7ec8e3;">Port: </label>
    <select id="port" style="padding:8px;background:#16213e;color:#eee;border:1px solid #0f3460;border-radius:4px;font-size:14px;">
      <option value="0">A1</option><option value="1">A2</option><option value="2">A3</option><option value="3">A4</option>
      <option value="4">B1</option><option value="5">B2</option><option value="6">B3</option><option value="7">B4</option>
    </select>
  </div>
  <div class="grid">
    <button class="btn" onclick="io('read_analog')">📖 Read Analog</button>
    <button class="btn" onclick="io('read_pullup')">📖 Read w/Pullup</button>
    <button class="btn" onclick="io('read_shunt')">📖 Read w/Shunt</button>
    <button class="btn" onclick="io('read_digital')">📖 Read Digital</button>
    <button class="btn" onclick="io('status')">📋 Status</button>
    <button class="btn" onclick="io('off')">⭕ All OFF</button>
  </div>
  <div class="grid">
    <button class="btn" onclick="io('set_pullup_on')">↑ Pullup ON</button>
    <button class="btn" onclick="io('set_pullup_off')">↓ Pullup OFF</button>
    <button class="btn" onclick="io('set_shunt_on')">↑ Shunt ON</button>
    <button class="btn" onclick="io('set_shunt_off')">↓ Shunt OFF</button>
    <button class="btn" onclick="io('set_analog_on')">↑ Analog ON</button>
    <button class="btn" onclick="io('set_analog_off')">↓ Analog OFF</button>
    <button class="btn" onclick="io('set_digital_on')">↑ Digital ON</button>
    <button class="btn" onclick="io('set_digital_off')">↓ Digital OFF</button>
  </div>

  <h2>Pulse Test (wire A1→B1, A2→B2, A3→B3, A4→B4)</h2>
  <div class="grid">
    <button class="btn" onclick="run('test_pulse',{pulses:10})">⚡ 10 pulser</button>
    <button class="btn" onclick="run('test_pulse',{pulses:50})">⚡ 50 pulser</button>
    <button class="btn" onclick="run('test_pulse',{pulses:100})">⚡ 100 pulser</button>
  </div>

  <h2>UART Loopback</h2>
  <div class="grid">
    <button class="btn" onclick="run('test_uart_loopback',{mode:'232'})">🔄 RS-232 Loopback</button>
    <button class="btn" onclick="run('test_uart_loopback',{mode:'485'})">🔄 RS-485 Loopback</button>
  </div>

  <h2>Voltage Select</h2>
  <div class="grid">
    <button class="btn" onclick="run('test_voltage',{channel:'A',voltage:5})">A → 5V</button>
    <button class="btn" onclick="run('test_voltage',{channel:'A',voltage:12})">A → 12V</button>
    <button class="btn" onclick="run('test_voltage',{channel:'A',voltage:24})">A → 24V</button>
    <button class="btn" onclick="run('test_voltage',{channel:'A',voltage:0})">A → OFF</button>
    <button class="btn" onclick="run('test_voltage',{channel:'B',voltage:5})">B → 5V</button>
    <button class="btn" onclick="run('test_voltage',{channel:'B',voltage:12})">B → 12V</button>
    <button class="btn" onclick="run('test_voltage',{channel:'B',voltage:24})">B → 24V</button>
    <button class="btn" onclick="run('test_voltage',{channel:'B',voltage:0})">B → OFF</button>
  </div>

  <h2>Relays</h2>
  <div class="grid">
    <button class="btn" onclick="run('test_relay',{relay:'A'})">⚡ Toggle Relay A</button>
    <button class="btn" onclick="run('test_relay',{relay:'B'})">⚡ Toggle Relay B</button>
  </div>

  <h2>Buzzer</h2>
  <div class="grid">
    <button class="btn" onclick="run('test_buzzer',{sound:1})">✓ OK</button>
    <button class="btn" onclick="run('test_buzzer',{sound:2})">✗ Error</button>
    <button class="btn" onclick="run('test_buzzer',{sound:3})">🔊 Startup</button>
    <button class="btn" onclick="run('test_buzzer',{sound:4})">🔘 Click</button>
    <button class="btn" onclick="run('test_buzzer',{sound:5})">⚠ Warning</button>
    <button class="btn" onclick="run('test_buzzer',{sound:6})">✔ Complete</button>
  </div>

  <h2>Output</h2>
  <div id="output"><span class="info">Ready. Click a test to begin.</span></div>

  <script>
    const out = document.getElementById('output');

    function log(msg, cls='') {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      out.appendChild(span);
      out.scrollTop = out.scrollHeight;
    }

    function clear() { out.innerHTML = ''; }

    function io(action) {
      const port = parseInt(document.getElementById('port').value);
      run('test_io', {port, action});
    }

    async function run(subject, data) {
      clear();
      log(`▶ Running: ${subject}` + (data && data.verbose ? ' (verbose)' : ''), 'info');
      log('  ⏳ Working...', 'warn');
      const body = { subject };
      if (data) body.data = data;

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000); // 30s timeout
        const r = await fetch('/api/function_silo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        clearTimeout(timeout);
        const text = await r.text();
        if (!text) { log('✗ Empty response', 'fail'); return; }
        const json = JSON.parse(text);
        clear();
        formatResult(subject, json);
      } catch (e) {
        if (e.name === 'AbortError') {
          log('✗ Timeout (test took >30s)', 'fail');
        } else {
          log(`✗ Error: ${e.message}`, 'fail');
        }
      }
    }

    function formatResult(subject, json) {
      if (subject === 'test_i2c_scan') {
        log(`\nI2C Devices (${json.found}/${json.total}):`);
        for (const d of json.devices) {
          const s = d.online ? '✓ OK' : '✗ --';
          log(`  ${d.addr}  ${s.padEnd(6)} ${d.name}`, d.online ? 'pass' : 'fail');
        }
      } else if (subject === 'test_adc_read') {
        log('\nADC Readings:');
        for (const ch of json.channels) {
          log(`  ${ch.name}: ${ch.volt} V  (${ch.mv} mV)`, 'info');
        }
      } else if (subject === 'test_selftest') {
        const allPass = json.fail === 0;
        log(`\n=== Self-Test: ${json.pass} PASS / ${json.fail} FAIL (${json.total} total) ===\n`,
            allPass ? 'pass' : 'fail');
        if (json.tests.length === 0) {
          log('  All tests passed! ✓', 'pass');
        } else {
          for (const t of json.tests) {
            const val = t.value !== undefined ? ` [${t.value}${t.unit||''}]` : '';
            log(`  ${t.pass ? '✓' : '✗'} ${t.test}${val}`, t.pass ? 'pass' : 'fail');
          }
        }
      } else if (subject === 'test_uart_loopback') {
        log(`\nUART Loopback (${json.mode}):`);
        const ab = json.a_to_b;
        log(`  A→B: sent "${ab.sent}" received "${ab.received}" ${ab.pass?'✓':'✗'}`, ab.pass?'pass':'fail');
        const ba = json.b_to_a;
        log(`  B→A: sent "${ba.sent}" received "${ba.received}" ${ba.pass?'✓':'✗'}`, ba.pass?'pass':'fail');
      } else if (subject === 'test_version') {
        log(`\nHardware version: ${json.hardware}`, 'info');
        log(`Module version:   ${json.module}`, 'info');
      } else if (subject === 'test_pulse') {
        log(`\n=== Pulse Test: ${json.pass} PASS / ${json.fail} FAIL (${json.pulses_per_channel} pulses/ch) ===\n`,
            json.fail === 0 ? 'pass' : 'fail');
        for (const r of json.results) {
          log(`  ${r.pass ? '✓' : '✗'} ${r.test}: ↑${r.rising} ↓${r.falling} = ${r.edges} edges (expected ${r.expected})  ${r.period_ms}ms/edge  ${r.freq_hz} Hz`, r.pass ? 'pass' : 'fail');
        }
      } else if (subject === 'test_io') {
        log(`\n${json.name} — ${json.action}:`, 'info');
        if (json.error) { log(`  ✗ ${json.error}`, 'fail'); }
        else if (json.volt !== undefined) log(`  ${json.volt} V  (${json.mv} mV)${json.supply_mv ? '  supply ~'+json.supply_mv+' mV' : ''}`, 'pass');
        else if (json.digital !== undefined) log(`  GPIO: ${json.digital} — ${json.state}`, 'pass');
        else if (json.result) log(`  ${json.result}`, 'pass');
        else log('  ' + JSON.stringify(json), 'info');
      } else {
        log('\n' + JSON.stringify(json, null, 2), 'info');
      }
      log('\n✓ Done', 'pass');
    }
  </script>
</body>
</html>
