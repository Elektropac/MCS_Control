<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MCS Control — Tanks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f4f1eb; color: #173447; padding: 20px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 900; color: #173447; }
    .nav { display: flex; gap: 8px; }
    .nav a { padding: 8px 14px; border: 2px solid #0c1b24; border-radius: 12px; background: #f7f1e6; color: #173447; font-weight: 700; font-size: 13px; text-decoration: none; box-shadow: 3px 3px 0 #cfc7ba; }
    .nav a.active { background: #dcefeb; color: #184654; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .controls select, .controls button { padding: 10px 14px; border: 2px solid #0c1b24; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .controls select { background: #fffdf8; color: #173447; }
    .controls button { background: #dcefeb; color: #184654; box-shadow: 3px 3px 0 #cfc7ba; }
    .controls button.stop { background: #ffe3d6; color: #8b3b16; }
    .controls .status { font-size: 13px; color: #617381; font-weight: 600; }
    .tank-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .tank-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .tank-grid { grid-template-columns: 1fr; } }
    .tank-card { border: 2px solid #cad6dc; border-radius: 18px; background: linear-gradient(180deg, #fffefb 0%, #fbf7ef 100%); box-shadow: 2px 2px 0 #ddd6ca; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .tank-card .name { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #617381; font-weight: 800; }
    .tank-card .value { font-size: 28px; font-weight: 900; color: #173447; line-height: 1; }
    .tank-card .value small { font-size: 14px; font-weight: 700; color: #476071; }
    .tank-card .sub { font-size: 12px; color: #617381; margin-top: 2px; }
    .tank-visual { position: relative; width: 100%; height: 80px; border: 3px solid #18394b; border-radius: 20px; background: linear-gradient(180deg, #fffefb 0%, #f3ead8 100%); box-shadow: 0 4px 0 rgba(198,186,166,.5); overflow: hidden; }
    .tank-fill { position: absolute; left: 5px; right: 5px; bottom: 5px; border-radius: 14px; background: linear-gradient(180deg, #7fd8df 0%, #2b8ab0 100%); transition: height 0.4s ease; }
    .tank-fill.low { background: linear-gradient(180deg, #ffd789 0%, #d6772c 100%); }
    .tank-fill.mid { background: linear-gradient(180deg, #7fd8df 0%, #2b8ab0 100%); }
    .tank-fill.high { background: linear-gradient(180deg, #ffe6a2 0%, #df9542 100%); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-green { color: #0d5a39; background: #d4f5e4; }
    .badge-yellow { color: #876015; background: #fff4db; }
    .badge-red { color: #8a2323; background: #fde3e3; }
    .badge-blue { color: #164f77; background: #dceefb; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⛽ Tanks</h1>
    <div class="nav">
      <a href="/">Home</a>
      <a href="/test.html">Test</a>
      <a href="/tanks.html" class="active">Tanks</a>
    </div>
  </div>

  <div class="controls">
    <select id="mode">
      <option value="ma">4-20 mA (Probe)</option>
      <option value="voltage">Voltage</option>
    </select>
    <label style="font-size:13px;color:#617381;font-weight:700;">Range:
      <input id="range-cm" type="number" value="300" min="1" max="10000" style="width:70px;padding:8px;border:2px solid #cad6dc;border-radius:10px;font-size:14px;font-weight:700;background:#fffdf8;"> cm
    </label>
    <button id="btn-start" onclick="startProbes()">▶ Start</button>
    <button id="btn-stop" class="stop" onclick="stopProbes()" style="display:none;">⏹ Stop</button>
    <span class="status" id="status">Idle</span>
  </div>

  <div class="tank-grid" id="tanks">
    <!-- Generated by JS -->
  </div>

  <script>
    const names = ['A1','A2','A3','A4','B1','B2','B3','B4'];
    let pollInterval = null;
    let currentMode = 'ma';

    // Generate tank cards
    const tanksEl = document.getElementById('tanks');
    for (let i = 0; i < 8; i++) {
      tanksEl.innerHTML += `
        <div class="tank-card" id="tank-${i}">
          <div class="name">Channel ${names[i]}</div>
          <div class="value" id="val-${i}">—<small></small></div>
          <div class="sub" id="sub-${i}">No data</div>
          <div class="tank-visual">
            <div class="tank-fill mid" id="fill-${i}" style="height:0%"></div>
          </div>
        </div>`;
    }

    async function apiCall(subject, data) {
      const r = await fetch('/api/function_silo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({subject, data})
      });
      return await r.json();
    }

    async function startProbes() {
      currentMode = document.getElementById('mode').value;
      await apiCall('test_probes', {action: 'start', mode: currentMode});
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = '';
      document.getElementById('status').textContent = 'Running';
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(poll, 500);
    }

    async function stopProbes() {
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      await apiCall('test_probes', {action: 'stop'});
      document.getElementById('btn-start').style.display = '';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('status').textContent = 'Idle';
    }

    async function poll() {
      try {
        const json = await apiCall('test_probes', {action: 'status'});
        if (!json.channels) return;
        for (let i = 0; i < 8; i++) {
          const ch = json.channels[i];
          const valEl = document.getElementById('val-' + i);
          const subEl = document.getElementById('sub-' + i);
          const fillEl = document.getElementById('fill-' + i);

          if (currentMode === 'ma') {
            const ma = parseFloat(ch.ma);
            const rangeCm = parseInt(document.getElementById('range-cm').value) || 300;
            const cm = ((ma - 4) / 16) * rangeCm;
            valEl.innerHTML = `${cm.toFixed(1)}<small> cm</small>`;
            subEl.textContent = `${ch.ma} mA · ${ch.mv} mV`;
            // 4-20mA → 0-100%
            const pct = Math.max(0, Math.min(100, ((ma - 4) / 16) * 100));
            fillEl.style.height = pct + '%';
            fillEl.className = 'tank-fill ' + (pct < 20 ? 'low' : pct > 80 ? 'high' : 'mid');
          } else {
            valEl.innerHTML = `${ch.volt}<small> V</small>`;
            subEl.textContent = `${ch.mv} mV`;
            // 0-5V → 0-100%
            const mv = parseInt(ch.mv);
            const pct = Math.max(0, Math.min(100, (mv / 5000) * 100));
            fillEl.style.height = pct + '%';
            fillEl.className = 'tank-fill ' + (pct < 20 ? 'low' : pct > 80 ? 'high' : 'mid');
          }
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
