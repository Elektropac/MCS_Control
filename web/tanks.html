<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MCS Control — Tanks</title>
  <style>
    :root{
      --mcs-blue:#047cd2; --mcs-blue-d:#0362a6; --heading:#2a3139;
      --body:#4d5968; --bg:#f6f8fa; --card:#fff; --line:#e3e8ee;
      --ok:#046c4e; --warn:#b76e00; --alarm:#b42318;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background: var(--bg); color: var(--body); }
    header { background: linear-gradient(135deg,var(--mcs-blue),var(--mcs-blue-d)); color:#fff; padding:16px 20px; }
    header .logo { height:34px; display:block; filter:brightness(0) invert(1); }
    header .sub { opacity:.9; font-size:13px; margin-top:6px; }
    nav { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); }
    nav a { padding:8px 14px; border-radius:8px; background:#eef4fb; color:var(--mcs-blue-d); font-weight:700; font-size:13px; text-decoration:none; }
    nav a.active { background:var(--mcs-blue); color:#fff; }
    main { padding: 18px 20px 40px; }
    .status-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 13px; color: #8a94a0; font-weight: 600; }
    .status-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--alarm); }
    .tank-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .tank-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .tank-grid { grid-template-columns: 1fr; } }
    .tank-card { border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 1px 3px rgba(16,40,70,.05); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .tank-card .name { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8a94a0; font-weight: 800; }
    .tank-card .id { font-size: 15px; font-weight: 800; color: var(--heading); }
    .tank-card .value { font-size: 28px; font-weight: 900; color: var(--mcs-blue-d); line-height: 1; }
    .tank-card .value small { font-size: 14px; font-weight: 700; color: #8a94a0; }
    .tank-card .sub { font-size: 12px; color: #8a94a0; margin-top: 2px; }
    .tank-visual { position: relative; width: 100%; height: 80px; border: 2px solid var(--line); border-radius: 14px; background: #f1f6fb; box-shadow: inset 0 1px 3px rgba(16,40,70,.06); overflow: hidden; box-sizing: border-box; }
    .tank-fill { position: absolute; left: 5px; right: 5px; bottom: 5px; max-height: calc(100% - 10px); border-radius: 10px; transition: height 0.4s ease; }
    .tank-fill.low { background: linear-gradient(180deg, #f3b0a8 0%, var(--alarm) 100%); }
    .tank-fill.mid { background: linear-gradient(180deg, #5bb3ee 0%, var(--mcs-blue-d) 100%); }
    .tank-fill.high { background: linear-gradient(180deg, #f0c47a 0%, var(--warn) 100%); }
    .tank-card .type-badge { font-size: 10px; color: var(--mcs-blue-d); background: #eef4fb; padding: 2px 8px; border-radius: 8px; display: inline-block; font-weight: 700; }
    .no-probes { text-align: center; padding: 60px 20px; color: #8a94a0; font-size: 16px; }
    .no-probes a, .status-bar a { color: var(--mcs-blue-d); }

    /* Alarm blink: pulse the card border + a tinted background until the
       reading returns within range. Different tints per alarm type. */
    @keyframes alarmPulseLow {
      0%,100% { border-color:var(--alarm); background:#fff5f3; box-shadow:0 1px 3px rgba(16,40,70,.05); }
      50%     { border-color:#f3b0a8; background:#fde8e8; box-shadow:0 0 14px rgba(180,35,24,.5); }
    }
    @keyframes alarmPulseOver {
      0%,100% { border-color:var(--warn); background:#fff7ec; box-shadow:0 1px 3px rgba(16,40,70,.05); }
      50%     { border-color:#f0c47a; background:#fdf0e3; box-shadow:0 0 14px rgba(183,110,0,.5); }
    }
    @keyframes alarmPulseFault {
      0%,100% { border-color:#6b27b4; background:#f8f1fb; box-shadow:0 1px 3px rgba(16,40,70,.05); }
      50%     { border-color:#c07fd6; background:#efe7fb; box-shadow:0 0 14px rgba(107,39,180,.5); }
    }
    .tank-card.alarm-low   { animation: alarmPulseLow   1s ease-in-out infinite; }
    .tank-card.alarm-over  { animation: alarmPulseOver  1s ease-in-out infinite; }
    .tank-card.alarm-fault { animation: alarmPulseFault 1s ease-in-out infinite; }
  </style>
</head>
<body>
  <header>
    <img class="logo" alt="MCS" src="/logo.png">
    <div class="sub">Tanks</div>
  </header>
  <nav>
    <a href="/">Home</a>
    <a href="/tanks.html" class="active">Tanks</a>
    <a href="/pumps.html">Pumps</a>
    <a href="/setup.html">Setup</a>
    <a href="/test.html">Test</a>
    <a href="/ota.html">Update</a>
  </nav>
  <main>

  <div class="status-bar">
    <span class="dot" id="dot"></span>
    <span id="status">Connecting...</span>
    <span id="product-name" style="margin-left:auto;"></span>
  </div>

  <div id="site-header" style="font-size:24px;font-weight:900;color:var(--heading);margin-bottom:16px;display:none;"></div>

  <div class="tank-grid" id="tanks"></div>
  <div class="no-probes" id="no-probes" style="display:none;">No probes configured. <a href="/setup.html">Open Setup</a></div>

  </main>

  <script>
    const API = '/api/';
    let probeCount = 0;

    function densityToMedia(d) {
      d = parseFloat(d);
      if (Math.abs(d - 0.84) < 0.01) return 'Diesel';
      if (Math.abs(d - 1.09) < 0.01) return 'AdBlue';
      if (Math.abs(d - 1.0) < 0.01) return 'Water';
      return 'ρ ' + d.toFixed(2);
    }

    // Prefer the media name from config; fall back to guessing from density.
    function mediaLabel(p) {
      return (p.media && p.media.length) ? p.media : densityToMedia(p.density);
    }

    async function api(subject) {
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({subject})
        });
        return await r.json();
      } catch(e) { return null; }
    }

    function buildCards(probes) {
      const el = document.getElementById('tanks');
      el.innerHTML = '';
      if (!probes || probes.length === 0) {
        document.getElementById('no-probes').style.display = '';
        return;
      }
      document.getElementById('no-probes').style.display = 'none';
      probes.forEach((p, i) => {
        el.innerHTML += `
          <div class="tank-card" id="card-${i}">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="id">${p.id}</div>
              <span class="type-badge">${mediaLabel(p)}</span>
            </div>
            <div class="value" id="val-${i}">—</div>
            <div class="sub" id="sub-${i}">Waiting...</div>
            <div class="tank-visual">
              <div class="tank-fill mid" id="fill-${i}" style="height:0%"></div>
            </div>
          </div>`;
      });
      probeCount = probes.length;
    }

    function updateCards(probes) {
      if (!probes) return;
      probes.forEach((p, i) => {
        const valEl = document.getElementById('val-' + i);
        const subEl = document.getElementById('sub-' + i);
        const fillEl = document.getElementById('fill-' + i);
        if (!valEl) return;

        const ma = parseFloat(p.ma);
        const mm = parseInt(p.mm) || 0;
        const liters = parseInt(p.liters);
        const hasLut = p.has_lut;
        const rangeMm = p.range_mm || 3000;
        const tempStr = (p.temp_c !== undefined) ? ` · ${parseFloat(p.temp_c).toFixed(1)}°C` : '';

        if (hasLut) {
          const pct = p.pct ? parseFloat(p.pct) : 0;
          const cap = p.capacity || 0;
          valEl.innerHTML = `${liters.toLocaleString()}<small> L</small>` + (cap > 0 ? `<small style="color:#617381;font-weight:600;"> / ${cap.toLocaleString()}</small>` : '');
          subEl.textContent = `${p.input} · ${pct.toFixed(1)}% · ${mm} mm · ${ma.toFixed(2)} mA${tempStr}`;
        } else {
          const pctNoLut = Math.max(0, Math.min(100, (mm / rangeMm) * 100));
          valEl.innerHTML = `${mm}<small> mm</small>`;
          subEl.textContent = `${p.input} · ${pctNoLut.toFixed(1)}% · ${ma.toFixed(2)} mA${tempStr}` + (liters > 0 ? ` · ${liters} L` : '');
        }

        const pct = hasLut && p.pct ? parseFloat(p.pct) : Math.max(0, Math.min(100, (mm / rangeMm) * 100));
        const isLow = p.low === true;
        const interiorPx = 64;
        fillEl.style.height = (Math.min(100, pct) / 100 * interiorPx) + 'px';
        fillEl.className = 'tank-fill ' + (isLow ? 'low' : pct > 80 ? 'high' : 'mid');

        // Alarm blink: pulse the card until the reading is back within range.
        // Priority fault > overfill > low. No alarm clears all classes.
        const card = document.getElementById('card-' + i);
        if (card) {
          card.classList.remove('alarm-low', 'alarm-over', 'alarm-fault');
          card.style.borderColor = '';   // let the animation own the border
          if (p.fault === true)                card.classList.add('alarm-fault');
          else if (p.overfill_alarm === true)  card.classList.add('alarm-over');
          else if (isLow)                      card.classList.add('alarm-low');
          else card.style.borderColor = '#cad6dc';   // normal, static border
        }
      });
    }

    async function poll() {
      const data = await api('cloudgauge_get_all');
      if (!data) {
        document.getElementById('dot').className = 'dot err';
        document.getElementById('status').textContent = 'Connection lost';
        return;
      }
      document.getElementById('dot').className = 'dot ok';
      document.getElementById('status').textContent = `Live · ${data.probes?.length || 0} probes`;
      document.getElementById('product-name').textContent = data.product || '';

      if (data.probes && data.probes.length !== probeCount) {
        buildCards(data.probes);
      }
      updateCards(data.probes);
    }

    // Init
    (async () => {
      const data = await api('cloudgauge_get_all');
      if (data && data.probes) {
        if (data.name) {
          document.getElementById('site-header').textContent = data.name;
          document.getElementById('site-header').style.display = '';
          document.title = data.name + ' — Tanks';
        }
        buildCards(data.probes);
        updateCards(data.probes);
        document.getElementById('dot').className = 'dot ok';
        document.getElementById('status').textContent = `Live · ${data.probes.length} probes`;
        document.getElementById('product-name').textContent = data.product || '';
      }
      setInterval(poll, 2000);
    })();
  </script>
</body>
</html>
