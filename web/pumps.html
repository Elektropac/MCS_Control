<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MCS Control — Pumps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f4f1eb; color: #173447; padding: 20px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 900; color: #173447; }
    .nav { display: flex; gap: 8px; }
    .nav a { padding: 8px 14px; border: 2px solid #0c1b24; border-radius: 12px; background: #f7f1e6; color: #173447; font-weight: 700; font-size: 13px; text-decoration: none; box-shadow: 3px 3px 0 #cfc7ba; }
    .nav a.active { background: #dcefeb; color: #184654; }
    .status-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 13px; color: #617381; font-weight: 600; }
    .status-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.ok { background: #2ecc71; }
    .dot.err { background: #e74c3c; }
    .pump-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .pump-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .pump-grid { grid-template-columns: 1fr; } }
    .pump-card { border: 2px solid #cad6dc; border-radius: 18px; background: linear-gradient(180deg, #fffefb 0%, #fbf7ef 100%); box-shadow: 2px 2px 0 #ddd6ca; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .pump-card .id { font-size: 15px; font-weight: 800; color: #173447; }
    .pump-card .value { font-size: 28px; font-weight: 900; color: #173447; line-height: 1; }
    .pump-card .value small { font-size: 14px; font-weight: 700; color: #476071; }
    .pump-card .sub { font-size: 12px; color: #617381; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 10px; color: #fff; padding: 3px 9px; border-radius: 8px; font-weight: 700; }
    .badge.on { background: #2ecc71; }
    .badge.off { background: #9aa7b0; }
    .badge.lifted { background: #df9542; }
    .badge.returned { background: #7f97a5; }
    .no-pumps { text-align: center; padding: 60px 20px; color: #617381; font-size: 16px; }
    /* Pulskvalitet */
    .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .qchip { display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; border-radius: 10px; cursor: pointer; border: 1.5px solid #cad6dc; background: #fbfdfc; transition: transform .05s; }
    .qchip:active { transform: translateY(1px); }
    .qchip .qlabel { font-size: 12px; font-weight: 800; }
    .qchip .qstat { font-size: 11px; font-weight: 700; }
    .qchip.ok  { border-color: #bfe6cf; background: #f1faf4; }
    .qchip.ok .qlabel { color: #1f8a4c; } .qchip.ok .qstat { color: #2ecc71; }
    .qchip.bad { border-color: #e9b4ad; background: #fdf1ef; }
    .qchip.bad .qlabel { color: #c0392b; } .qchip.bad .qstat { color: #e74c3c; }
    .qchip.info { border-color: #b9d4e6; background: #f0f7fc; }
    .qchip.info .qlabel { color: #1f6a9c; } .qchip.info .qstat { color: #2a7fb8; }
    .qmeta { grid-column: 1 / -1; font-size: 10px; color: #8a9aa6; margin-top: 2px; }
    .qreset { grid-column: 1 / -1; margin-top: 4px; padding: 6px; border: 1.5px solid #cad6dc; border-radius: 10px; background: #f7f1e6; color: #173447; font-weight: 700; font-size: 11px; cursor: pointer; }
    /* Modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(10,20,30,.45); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    .modal-bg.show { display: flex; }
    .modal { background: #fffefb; border-radius: 16px; max-width: 420px; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
    .modal h2 { font-size: 18px; color: #173447; margin-bottom: 10px; }
    .modal p { font-size: 14px; color: #3a5160; line-height: 1.55; margin-bottom: 8px; }
    .modal .close { margin-top: 12px; padding: 9px 16px; border: 2px solid #0c1b24; border-radius: 10px; background: #dcefeb; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div class="modal-bg" id="qmodal" onclick="if(event.target===this)this.classList.remove('show')">
    <div class="modal">
      <h2 id="qmodal-title">—</h2>
      <p id="qmodal-what"></p>
      <p id="qmodal-cause"></p>
      <p id="qmodal-action"></p>
      <button class="close" onclick="document.getElementById('qmodal').classList.remove('show')">Luk</button>
    </div>
  </div>
  <div class="header">
    <h1>&#9981; Pumps</h1>
    <div class="nav">
      <a href="/">Home</a>
      <a href="/tanks.html">Tanks</a>
      <a href="/pumps.html" class="active">Pumps</a>
      <a href="/setup.html">Setup</a>
      <a href="/test.html">Test</a>
      <a href="/ota.html">Update</a>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot" id="dot"></span>
    <span id="status">Connecting...</span>
  </div>

  <div class="pump-grid" id="pumps"></div>
  <div class="no-pumps" id="no-pumps" style="display:none;">No pumps configured. <a href="/setup.html">Open Setup</a></div>

  <script>
    const API = '/api/';
    let pumpCount = -1;

    async function api(subject) {
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({subject})
        });
        return await r.json();
      } catch(e) { return null; }
    }

    // Forklaringer pr. fejltype til popup (hvad / årsag / handling).
    const QINFO = {
      jitter: {
        title: 'Jitter — uregelmæssige pulser',
        what: 'Tiden mellem pulserne svinger meget, selvom flowet burde være jævnt.',
        cause: 'Mulig årsag: slidt pulsgiver, dårlig/løs forbindelse eller elektrisk støj på signalet.',
        action: 'Tjek kabling og stik. Hvis det fortsætter: udskift pulsgiveren.'
      },
      dropout: {
        title: 'Dropout — manglende pulser',
        what: 'Nogle pulser når ikke frem — der er huller i strømmen. Flowet måles for LAVT, så kunden får mere end der registreres.',
        cause: 'Mulig årsag: løs ledning, defekt pulsgiver eller for svagt signal.',
        action: 'Tjek forbindelsen og signalniveauet. Kalibrér/udskift pulsgiveren.'
      },
      prel: {
        title: 'Prel — dobbelt-tælling',
        what: 'Kontakten "preller" og giver falske ekstra pulser oven i de rigtige. Flowet måles for HØJT, så kunden får mindre end der registreres.',
        cause: 'Mulig årsag: slidt mekanisk pulsgiver eller manglende afstøjning.',
        action: 'Udskift pulsgiveren eller tilføj debounce/filter på indgangen.'
      },
      ghost: {
        title: 'Spøgelsespulser — flow uden tankning',
        what: 'Der kommer pulser mens dysen er lagt på plads / relæet er slået fra. Det bør aldrig ske.',
        cause: 'Mulig årsag: elektrisk støj, fejlkobling eller — i værste fald — uautoriseret flow.',
        action: 'Undersøg straks. Tjek kabling og at pulsgiveren ikke påvirkes af andet udstyr.'
      },
      frekvens: {
        title: 'Frekvens — målt pulsrate',
        what: 'Den aktuelt målte pulsrate (Hz). Sammenlign med den forventede rate (flow × pulser/liter ÷ 60). Afviger den systematisk, tæller pulsgiveren forkert antal pulser pr. liter.',
        cause: 'Mulig årsag: pulsgiveren er miskalibreret eller af forkert type.',
        action: 'Kalibrér pulsgiveren — justér pulser/liter så den målte mængde passer med en kendt reference-dosering.'
      }
    };
    function showQ(key) {
      const info = QINFO[key];
      if (!info) return;
      document.getElementById('qmodal-title').textContent = info.title;
      document.getElementById('qmodal-what').textContent = info.what;
      document.getElementById('qmodal-cause').textContent = info.cause;
      document.getElementById('qmodal-action').textContent = 'Handling: ' + info.action;
      document.getElementById('qmodal').classList.add('show');
    }
    async function resetQuality() {
      await api('pump_quality_reset');
      poll();
    }

    function buildCards(pumps) {
      const el = document.getElementById('pumps');
      el.innerHTML = '';
      if (!pumps || pumps.length === 0) {
        document.getElementById('no-pumps').style.display = '';
        return;
      }
      document.getElementById('no-pumps').style.display = 'none';
      pumps.forEach((p, i) => {
        el.innerHTML += `
          <div class="pump-card" id="card-${i}">
            <div class="row">
              <div class="id">${p.name || p.id}</div>
              <span class="badge off" id="relay-${i}">RELAY</span>
            </div>
            <div class="value" id="litres-${i}">—<small> L</small></div>
            <div class="sub" id="sub-${i}">Waiting...</div>
            <div class="row">
              <span class="sub">Nozzle</span>
              <span class="badge returned" id="nozzle-${i}">—</span>
            </div>
            <div class="row">
              <span class="sub">Pulskvalitet</span>
            </div>
            <div class="qgrid" id="qgrid-${i}"></div>
          </div>`;
      });
      pumpCount = pumps.length;
    }

    function updateCards(pumps) {
      if (!pumps) return;
      pumps.forEach((p, i) => {
        const litresEl = document.getElementById('litres-' + i);
        if (!litresEl) return;
        const litres = parseFloat(p.litres) || 0;
        const ppl = parseFloat(p.pulses_per_litre) || 0;
        litresEl.innerHTML = `${litres.toFixed(2)}<small> L</small>`;

        const subEl = document.getElementById('sub-' + i);
        subEl.textContent = `${p.pulse_input} · ${p.pulses} pulses`
          + (ppl ? ` · ${ppl}/L` : '')
          + (parseFloat(p.preset_litres) > 0 ? ` · preset ${p.preset_litres} L` : '');

        const relayEl = document.getElementById('relay-' + i);
        relayEl.textContent = p.relay_on ? 'RELAY ON' : 'RELAY OFF';
        relayEl.className = 'badge ' + (p.relay_on ? 'on' : 'off');

        const nozEl = document.getElementById('nozzle-' + i);
        nozEl.textContent = p.nozzle_lifted ? 'Lifted' : 'Returned';
        nozEl.className = 'badge ' + (p.nozzle_lifted ? 'lifted' : 'returned');

        // Pulskvalitet (Fase 1: kun visning)
        // Pulskvalitet: vis ALLE fejltyper samtidig, hver med egen status.
        const q = p.quality || {};
        const cv = parseFloat(q.cv_pct) || 0;
        const hz = parseFloat(q.hz) || 0;
        // Hver type: {navn, dårlig?, kort måltal}
        const types = [
          { key:'jitter',   label:'Jitter',    bad:(q.jitter>4 || cv>20), detail:`${cv.toFixed(0)}% variation` },
          { key:'dropout',  label:'Dropout',   bad:(q.dropout>2),         detail:`${q.dropout||0} tabt` },
          { key:'prel',     label:'Prel',      bad:(q.bounce>2),          detail:`${q.bounce||0} dobbelt` },
          { key:'ghost',    label:'Spøgelse',  bad:(q.ghost>0),           detail:`${q.ghost||0} uden flow` },
          { key:'frekvens', label:'Frekvens',  bad:false, info:true, detail:`${hz.toFixed(0)} Hz målt` },
        ];
        const grid = document.getElementById('qgrid-' + i);
        if (grid) {
          grid.innerHTML = types.map(t =>
            `<div class="qchip ${t.bad?'bad':(t.info?'info':'ok')}" onclick="showQ('${t.key}')">
               <span class="qlabel">${t.label}</span>
               <span class="qstat">${(t.bad||t.info) ? t.detail : 'OK'}</span>
             </div>`
          ).join('')
          + `<div class="qmeta">${q.window||0} pulser målt · tryk på en type for forklaring</div>`
          + `<button class="qreset" onclick="resetQuality()">Nulstil pulskvalitet</button>`;
        }
      });
    }

    async function poll() {
      const data = await api('pump_get_all');
      if (!data) {
        document.getElementById('dot').className = 'dot err';
        document.getElementById('status').textContent = 'Connection lost';
        return;
      }
      document.getElementById('dot').className = 'dot ok';
      document.getElementById('status').textContent = `Live · ${data.pumps ? data.pumps.length : 0} pump(s)`;
      if (data.pumps && data.pumps.length !== pumpCount) buildCards(data.pumps);
      updateCards(data.pumps);
    }

    (async () => {
      const data = await api('pump_get_all');
      if (data) {
        buildCards(data.pumps || []);
        updateCards(data.pumps);
        document.getElementById('dot').className = 'dot ok';
        document.getElementById('status').textContent = `Live · ${data.pumps ? data.pumps.length : 0} pump(s)`;
      }
      setInterval(poll, 1000);
    })();
  </script>
</body>
</html>
