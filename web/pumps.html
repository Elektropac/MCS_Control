<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MCS Control — Pumps</title>
  <style>
    :root{
      --mcs-blue:#047cd2; --mcs-blue-d:#0362a6; --heading:#2a3139;
      --body:#4d5968; --bg:#f6f8fa; --card:#fff; --line:#e3e8ee;
      --ok:#046c4e; --warn:#b76e00; --alarm:#b42318;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background: var(--bg); color: var(--body); }
    header { background: linear-gradient(135deg,var(--mcs-blue),var(--mcs-blue-d)); color:#fff; padding:16px 20px; }
    header .logo { height:34px; display:block; filter:brightness(0) invert(1); }
    header .sub { opacity:.9; font-size:13px; margin-top:6px; }
    nav { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); }
    nav a { padding:8px 14px; border-radius:8px; background:#eef4fb; color:var(--mcs-blue-d); font-weight:700; font-size:13px; text-decoration:none; }
    nav a.active { background:var(--mcs-blue); color:#fff; }
    main { padding: 18px 20px 40px; }
    .status-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 13px; color: #8a94a0; font-weight: 600; }
    .status-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--alarm); }
    .pump-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .pump-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .pump-grid { grid-template-columns: 1fr; } }
    .pump-card { border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 1px 3px rgba(16,40,70,.05); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .pump-card .id { font-size: 15px; font-weight: 800; color: var(--heading); }
    .pump-card .value { font-size: 28px; font-weight: 900; color: var(--mcs-blue-d); line-height: 1; }
    .pump-card .value small { font-size: 14px; font-weight: 700; color: #8a94a0; }
    .pump-card .sub { font-size: 12px; color: #8a94a0; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 10px; color: #fff; padding: 3px 9px; border-radius: 8px; font-weight: 700; }
    .badge.on { background: var(--ok); }
    .badge.off { background: #9aa7b0; }
    .badge.lifted { background: var(--warn); }
    .badge.returned { background: #9aa7b0; }
    .no-pumps { text-align: center; padding: 60px 20px; color: #8a94a0; font-size: 16px; }
    .no-pumps a { color: var(--mcs-blue-d); }
    /* Pulse quality */
    .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .qchip { display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: #fbfdff; transition: transform .05s; }
    .qchip:active { transform: translateY(1px); }
    .qchip .qlabel { font-size: 12px; font-weight: 800; }
    .qchip .qstat { font-size: 11px; font-weight: 700; }
    .qchip.ok  { border-color: #bfe6cf; background: #f1faf4; }
    .qchip.ok .qlabel { color: var(--ok); } .qchip.ok .qstat { color: var(--ok); }
    .qchip.bad { border-color: #f3d1cd; background: #fdf1ef; }
    .qchip.bad .qlabel { color: var(--alarm); } .qchip.bad .qstat { color: var(--alarm); }
    .qchip.info { border-color: #c5ddf0; background: #eef4fb; }
    .qchip.info .qlabel { color: var(--mcs-blue-d); } .qchip.info .qstat { color: var(--mcs-blue); }
    .qmeta { grid-column: 1 / -1; font-size: 10px; color: #8a9aa6; margin-top: 2px; }
    .qreset { grid-column: 1 / -1; margin-top: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: #eef4fb; color: var(--mcs-blue-d); font-weight: 700; font-size: 11px; cursor: pointer; }
    /* Modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(10,20,30,.45); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    .modal-bg.show { display: flex; }
    .modal { background: var(--card); border-radius: 12px; max-width: 420px; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
    .modal h2 { font-size: 18px; color: var(--heading); margin-bottom: 10px; }
    .modal p { font-size: 14px; color: var(--body); line-height: 1.55; margin-bottom: 8px; }
    .modal .close { margin-top: 12px; padding: 9px 16px; border: none; border-radius: 8px; background: var(--mcs-blue); color: #fff; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <img class="logo" alt="MCS" src="/logo.png">
    <div class="sub">Pumps</div>
  </header>
  <nav>
    <a href="/">Home</a>
    <a href="/tanks.html">Tanks</a>
    <a href="/pumps.html" class="active">Pumps</a>
    <a href="/setup.html">Setup</a>
    <a href="/test.html">Test</a>
    <a href="/ota.html">Update</a>
  </nav>
  <main>
  <div class="modal-bg" id="qmodal" onclick="if(event.target===this)this.classList.remove('show')">
    <div class="modal">
      <h2 id="qmodal-title">—</h2>
      <p id="qmodal-what"></p>
      <p id="qmodal-cause"></p>
      <p id="qmodal-action"></p>
      <button class="close" onclick="document.getElementById('qmodal').classList.remove('show')">Close</button>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot" id="dot"></span>
    <span id="status">Connecting...</span>
  </div>

  <div class="pump-grid" id="pumps"></div>
  <div class="no-pumps" id="no-pumps" style="display:none;">No pumps configured. <a href="/setup.html">Open Setup</a></div>

  </main>

  <script>
    const API = '/api/';
    let pumpCount = -1;

    async function api(subject) {
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({subject})
        });
        return await r.json();
      } catch(e) { return null; }
    }

    // Explanation per fault type for the popup (what / cause / action).
    const QINFO = {
      jitter: {
        title: 'Jitter — irregular pulses',
        what: 'The time between pulses varies a lot, even though the flow should be steady.',
        cause: 'Possible cause: worn pulse sender, poor/loose connection, or electrical noise on the signal.',
        action: 'Check wiring and connectors. If it persists: replace the pulse sender.'
      },
      dropout: {
        title: 'Dropout — missing pulses',
        what: 'Some pulses do not arrive — there are gaps in the stream. Flow is measured too LOW, so the customer gets more than is registered.',
        cause: 'Possible cause: loose wire, faulty pulse sender, or too weak a signal.',
        action: 'Check the connection and signal level. Calibrate/replace the pulse sender.'
      },
      prel: {
        title: 'Bounce — double counting',
        what: 'The contact "bounces" and produces false extra pulses on top of the real ones. Flow is measured too HIGH, so the customer gets less than is registered.',
        cause: 'Possible cause: worn mechanical pulse sender or missing debounce.',
        action: 'Replace the pulse sender or add a debounce/filter on the input.'
      },
      ghost: {
        title: 'Ghost pulses — flow without fuelling',
        what: 'Pulses arrive while the nozzle is returned / the relay is off. This should never happen.',
        cause: 'Possible cause: electrical noise, miswiring, or — worst case — unauthorised flow.',
        action: 'Investigate immediately. Check wiring and that the pulse sender is not affected by other equipment.'
      },
      frekvens: {
        title: 'Frequency — measured pulse rate',
        what: 'The currently measured pulse rate (Hz). Compare with the expected rate (flow × pulses/litre ÷ 60). A systematic deviation means the pulse sender counts the wrong number of pulses per litre.',
        cause: 'Possible cause: the pulse sender is miscalibrated or the wrong type.',
        action: 'Calibrate the pulse sender — adjust pulses/litre so the measured volume matches a known reference dose.'
      }
    };
    function showQ(key) {
      const info = QINFO[key];
      if (!info) return;
      document.getElementById('qmodal-title').textContent = info.title;
      document.getElementById('qmodal-what').textContent = info.what;
      document.getElementById('qmodal-cause').textContent = info.cause;
      document.getElementById('qmodal-action').textContent = 'Action: ' + info.action;
      document.getElementById('qmodal').classList.add('show');
    }
    async function resetQuality() {
      await api('pump_quality_reset');
      poll();
    }

    function buildCards(pumps) {
      const el = document.getElementById('pumps');
      el.innerHTML = '';
      if (!pumps || pumps.length === 0) {
        document.getElementById('no-pumps').style.display = '';
        return;
      }
      document.getElementById('no-pumps').style.display = 'none';
      pumps.forEach((p, i) => {
        el.innerHTML += `
          <div class="pump-card" id="card-${i}">
            <div class="row">
              <div class="id">${p.name || p.id}</div>
              <span class="badge off" id="relay-${i}">RELAY</span>
            </div>
            <div class="value" id="litres-${i}">—<small> L</small></div>
            <div class="sub" id="sub-${i}">Waiting...</div>
            <div class="row">
              <span class="sub">Nozzle</span>
              <span class="badge returned" id="nozzle-${i}">—</span>
            </div>
            <div class="row">
              <span class="sub">Pulse quality</span>
            </div>
            <div class="qgrid" id="qgrid-${i}"></div>
          </div>`;
      });
      pumpCount = pumps.length;
    }

    function updateCards(pumps) {
      if (!pumps) return;
      pumps.forEach((p, i) => {
        const litresEl = document.getElementById('litres-' + i);
        if (!litresEl) return;
        const litres = parseFloat(p.litres) || 0;
        const ppl = parseFloat(p.pulses_per_litre) || 0;
        litresEl.innerHTML = `${litres.toFixed(2)}<small> L</small>`;

        const subEl = document.getElementById('sub-' + i);
        subEl.textContent = `${p.pulse_input} · ${p.pulses} pulses`
          + (ppl ? ` · ${ppl}/L` : '')
          + (parseFloat(p.preset_litres) > 0 ? ` · preset ${p.preset_litres} L` : '');

        const relayEl = document.getElementById('relay-' + i);
        relayEl.textContent = p.relay_on ? 'RELAY ON' : 'RELAY OFF';
        relayEl.className = 'badge ' + (p.relay_on ? 'on' : 'off');

        const nozEl = document.getElementById('nozzle-' + i);
        nozEl.textContent = p.nozzle_lifted ? 'Lifted' : 'Returned';
        nozEl.className = 'badge ' + (p.nozzle_lifted ? 'lifted' : 'returned');

        // Pulse quality (Phase 1: display only)
        // Pulse quality: show ALL fault types at once, each with its own status.
        const q = p.quality || {};
        const cv = parseFloat(q.cv_pct) || 0;
        const hz = parseFloat(q.hz) || 0;
        // Each type: {name, bad?, short metric}
        const types = [
          { key:'jitter',   label:'Jitter',    bad:(q.jitter>4 || cv>20), detail:`${cv.toFixed(0)}% variation` },
          { key:'dropout',  label:'Dropout',   bad:(q.dropout>2),         detail:`${q.dropout||0} missed` },
          { key:'prel',     label:'Bounce',      bad:(q.bounce>2),          detail:`${q.bounce||0} double` },
          { key:'ghost',    label:'Ghost',  bad:(q.ghost>0),           detail:`${q.ghost||0} no-flow` },
          { key:'frekvens', label:'Frequency',  bad:false, info:true, detail:`${hz.toFixed(0)} Hz measured` },
        ];
        const grid = document.getElementById('qgrid-' + i);
        if (grid) {
          grid.innerHTML = types.map(t =>
            `<div class="qchip ${t.bad?'bad':(t.info?'info':'ok')}" onclick="showQ('${t.key}')">
               <span class="qlabel">${t.label}</span>
               <span class="qstat">${(t.bad||t.info) ? t.detail : 'OK'}</span>
             </div>`
          ).join('')
          + `<div class="qmeta">${q.window||0} pulses measured · tap a type for explanation</div>`
          + `<button class="qreset" onclick="resetQuality()">Reset pulse quality</button>`;
        }
      });
    }

    async function poll() {
      const data = await api('pump_get_all');
      if (!data) {
        document.getElementById('dot').className = 'dot err';
        document.getElementById('status').textContent = 'Connection lost';
        return;
      }
      document.getElementById('dot').className = 'dot ok';
      document.getElementById('status').textContent = `Live · ${data.pumps ? data.pumps.length : 0} pump(s)`;
      if (data.pumps && data.pumps.length !== pumpCount) buildCards(data.pumps);
      updateCards(data.pumps);
    }

    (async () => {
      const data = await api('pump_get_all');
      if (data) {
        buildCards(data.pumps || []);
        updateCards(data.pumps);
        document.getElementById('dot').className = 'dot ok';
        document.getElementById('status').textContent = `Live · ${data.pumps ? data.pumps.length : 0} pump(s)`;
      }
      setInterval(poll, 1000);
    })();
  </script>
</body>
</html>
